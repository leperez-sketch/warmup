<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tug of War: Language Festival</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="navbar">
    <button class="nav-btn">🏠 HOME</button>
    <h1 class="game-title">TUG OF WAR: ENGLISH LANGUAGE</h1>
    <div class="lang-selector">🇬🇧 EN ▾</div>
  </header>

  <main class="game-container">
    <section class="card team-card blue-team">
      <div class="team-header">
        <h2>BLUE KNIGHTS</h2>
        <span class="score" id="score-blue">4</span>
      </div>
      <div class="question-box">
        <p class="question-text">Which tense:<br><strong>"I will go tomorrow"</strong>?</p>
        <div class="options" id="options-blue">
          <button class="opt-btn" onclick="selectAnswer('blue', 'A')">A. Present Simple</button>
          <button class="opt-btn correct" onclick="selectAnswer('blue', 'B')">B. Future Simple</button>
          <button class="opt-btn" onclick="selectAnswer('blue', 'C')">C. Present Continuous</button>
          <button class="opt-btn" onclick="selectAnswer('blue', 'D')">D. Past Simple</button>
        </div>
      </div>
    </section>

    <section class="stage-container">
      <div class="stage-header">
        <span class="team-score-summary blue-color">Blue: <strong id="summary-blue">4</strong></span>
        <div class="timer-badge">⏱️ <span id="timer">01:15</span></div>
        <span class="team-score-summary red-color">Red: <strong id="summary-red">3</strong></span>
      </div>

      <div class="canvas-wrapper">
        <canvas id="tugCanvas" width="600" height="320"></canvas>
      </div>

      <div class="audio-controls">
        <button id="musicToggleBtn" onclick="toggleAudio()">🎵 Música: ON</button>
      </div>
    </section>

    <section class="card team-card red-team">
      <div class="team-header">
        <h2>RED DRAGONS</h2>
        <span class="score" id="score-red">3</span>
      </div>
      <div class="question-box">
        <p class="question-text">Choose the correct form:<br><strong>"There are two cats"</strong></p>
        <div class="options" id="options-red">
          <button class="opt-btn correct" onclick="selectAnswer('red', 'A')">A. There are two cats</button>
          <button class="opt-btn" onclick="selectAnswer('red', 'B')">B. There two cats</button>
          <button class="opt-btn" onclick="selectAnswer('red', 'C')">C. There be two cats</button>
          <button class="opt-btn" onclick="selectAnswer('red', 'D')">D. There is two cats</button>
        </div>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
